name: Mousa bootstrap checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  music-ir-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run experimental symbolic music unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Verify scale fixtures with an independent MIDI parser
        run: |
          python -m pip install mido==1.3.3
          PYTHONPATH=src python examples/export_scale_examples.py --out "$RUNNER_TEMP/mousa-scale-fixtures"
          python tools/verify_scale_pack.py "$RUNNER_TEMP/mousa-scale-fixtures"
          PYTHONPATH=src python examples/export_degree_render_fixtures.py --out "$RUNNER_TEMP/mousa-degree-fixtures"
          python tools/verify_scale_pack.py "$RUNNER_TEMP/mousa-degree-fixtures"
      - name: Verify mandatory native scale rules
        run: |
          g++ -std=c++20 -O2 experiments/maidionis-scale-generation/scale_rule_tests.cpp -o "$RUNNER_TEMP/mousa-scale-rule-tests"
          "$RUNNER_TEMP/mousa-scale-rule-tests"
