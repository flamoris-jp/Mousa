name: Mousa bootstrap checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  music-ir-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run experimental MusicIR unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
