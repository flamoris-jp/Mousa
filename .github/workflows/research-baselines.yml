name: Research baseline tests
on:
  pull_request:
    paths:
      - 'src/mousa/**'
      - 'tests/**'
      - 'tools/compare_*.py'
      - '.github/workflows/research-baselines.yml'
permissions:
  contents: read
jobs:
  research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional MIDI research dependency
        run: python -m pip install mido==1.3.3
      - name: Fast tests including trailing-silence and pitch restoration
        run: PYTHONPATH=src python -m unittest discover -s tests -v
